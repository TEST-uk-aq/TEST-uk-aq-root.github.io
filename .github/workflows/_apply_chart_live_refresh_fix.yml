name: Apply chart live refresh fix

# Trigger after the workflow is present on main.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_apply_chart_live_refresh_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Hex Map chart loading and refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("hex_map/index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          old_progress = '''    const clearObservationProgress = () => {
            if (observationProgressBar?.remove) observationProgressBar.remove();
            if (dom?.chartFrame?.progressBar === observationProgressBar) {
              dom.chartFrame.progressBar = null;
            }
            observationProgressBar = null;
            observationProgressTotal = 0;
            settledObservationChunks = 0;
          };
          const beginObservationProgress = (totalChunks) => {
            if (!Number.isFinite(totalChunks) || totalChunks <= 0 || !dom?.chartFrame) return;
            clearObservationProgress();
            observationProgressTotal = totalChunks;
            const progressFrame = {
              margin: dom.chartFrame.margin,
              width: dom.chartFrame.width,
              height: dom.chartFrame.height,
            };
            observationProgressBar = ChartCore.renderProgressBar(dom.chartFrame.svgEl, progressFrame);
            dom.chartFrame.progressBar = observationProgressBar;
          };
          const settleObservationProgress = () => {
            if (!observationProgressBar || observationProgressTotal <= 0) return;
            settledObservationChunks = Math.min(observationProgressTotal, settledObservationChunks + 1);
            observationProgressBar.update(settledObservationChunks / observationProgressTotal);
          };
          '''

          new_progress = '''    const clearObservationProgress = () => {
            if (observationProgressBar?.remove) observationProgressBar.remove();
            if (dom?.chartFrame?.progressBar === observationProgressBar) {
              dom.chartFrame.progressBar = null;
            }
            observationProgressBar = null;
            observationProgressTotal = 0;
            settledObservationChunks = 0;
          };
          const ensureObservationProgress = () => {
            if (observationProgressBar || observationProgressTotal <= 0 || !dom?.chartFrame) return;
            const progressFrame = {
              margin: dom.chartFrame.margin,
              width: dom.chartFrame.width,
              height: dom.chartFrame.height,
            };
            observationProgressBar = ChartCore.renderProgressBar(dom.chartFrame.svgEl, progressFrame);
            dom.chartFrame.progressBar = observationProgressBar;
            observationProgressBar.update(settledObservationChunks / observationProgressTotal);
          };
          const addObservationProgressWork = (chunkCount) => {
            const count = Math.max(0, Math.floor(Number(chunkCount) || 0));
            if (!count) return;
            observationProgressTotal += count;
            ensureObservationProgress();
            observationProgressBar?.update(settledObservationChunks / observationProgressTotal);
          };
          const beginObservationProgress = (totalChunks) => {
            clearObservationProgress();
            addObservationProgressWork(totalChunks);
          };
          const settleObservationProgress = () => {
            if (!observationProgressBar || observationProgressTotal <= 0) return;
            settledObservationChunks = Math.min(observationProgressTotal, settledObservationChunks + 1);
            observationProgressBar.update(settledObservationChunks / observationProgressTotal);
          };
          '''
          replace_once(old_progress, new_progress, "progress tracker")

          loader_marker = '''  async function loadStationHistoryOlderChunks(kind, entry, record, range, stableHeadStartUtc, initialCursorEndUtc, windowValue, renderScheduler, signal, token, concurrency, priority, onWorkSettled = null) {'''
          loader_helper = '''  function countStationHistoryChunkWork(kind, record, rangeStartIso, initialCursorEndUtc, windowValue) {
            const loader = window.UkAqStationHistoryLoader;
            if (!record || !rangeStartIso || !initialCursorEndUtc || !loader?.buildMissingChunkWorkList) return 0;
            const spanMs = getChunkSpanMs(windowValue);
            const workKinds = kind === "combined" ? ["observations", "aqi"] : [kind];
            const ranges = new Set();
            workKinds.forEach((coverageKind) => {
              loader.buildMissingChunkWorkList(
                record,
                coverageKind,
                rangeStartIso,
                initialCursorEndUtc,
                spanMs,
              ).forEach((item) => {
                const startUtc = String(item?.range?.start_utc || "").trim();
                const endUtc = String(item?.range?.end_utc || "").trim();
                if (startUtc && endUtc) ranges.add(`${startUtc}|${endUtc}`);
              });
            });
            return ranges.size;
          }

'''
          replace_once(loader_marker, loader_helper + loader_marker, "station-history work counter")

          old_primary_history = '''      const aqiHeadStart = stationHistoryNextBoundary(primaryPayload.aqi, "aqi");
          // Primary combined history is highest priority.  Its requests run in
          // parallel with lower-priority secondary observation streams, while the
          // global scheduler always admits queued primary work first.
          const primaryHistoryPromise = aqiHeadStart
            ? loadStationHistoryOlderChunks("combined", primary, primaryRecord, range, aqiHeadBounds?.startUtc, aqiHeadStart, windowValue, historyRenderScheduler, signal, token, STATION_HISTORY_AQI_CHUNK_CONCURRENCY, STATION_HISTORY_FETCH_PRIORITY.primary)
            : Promise.resolve();
          '''
          new_primary_history = '''      const aqiHeadStart = stationHistoryNextBoundary(primaryPayload.aqi, "aqi");
          const primaryHistoryChunkCount = aqiHeadStart
            ? countStationHistoryChunkWork("combined", primaryRecord, range.startIso, aqiHeadStart, windowValue)
            : 0;
          beginObservationProgress(primaryHistoryChunkCount);
          // Primary combined history is highest priority.  Its requests run in
          // parallel with lower-priority secondary observation streams, while the
          // global scheduler always admits queued primary work first.
          const primaryHistoryPromise = aqiHeadStart
            ? loadStationHistoryOlderChunks("combined", primary, primaryRecord, range, aqiHeadBounds?.startUtc, aqiHeadStart, windowValue, historyRenderScheduler, signal, token, STATION_HISTORY_AQI_CHUNK_CONCURRENCY, STATION_HISTORY_FETCH_PRIORITY.primary, settleObservationProgress)
            : Promise.resolve();
          '''
          replace_once(old_primary_history, new_primary_history, "primary history progress")

          old_secondary_history = '''            const cursor = record.current_observation_next_chunk_end_utc;
                if (cursor) {
                  await loadStationHistoryOlderChunks(
                    "observations",
                    entry,
                    record,
                    range,
                    record.observation_head_start_utc,
                    cursor,
                    windowValue,
                    historyRenderScheduler,
                    signal,
                    token,
                    STATION_HISTORY_OBSERVATION_CHUNK_CONCURRENCY,
                    STATION_HISTORY_FETCH_PRIORITY.observations,
                    settleObservationProgress,
                  );
                }
                // Prefetch only after this sensor's matching observation range has
          '''
          new_secondary_history = '''            const cursor = record.current_observation_next_chunk_end_utc;
                if (cursor) {
                  addObservationProgressWork(
                    countStationHistoryChunkWork("observations", record, range.startIso, cursor, windowValue),
                  );
                  await loadStationHistoryOlderChunks(
                    "observations",
                    entry,
                    record,
                    range,
                    record.observation_head_start_utc,
                    cursor,
                    windowValue,
                    historyRenderScheduler,
                    signal,
                    token,
                    STATION_HISTORY_OBSERVATION_CHUNK_CONCURRENCY,
                    STATION_HISTORY_FETCH_PRIORITY.observations,
                    settleObservationProgress,
                  );
                }
                // Prefetch only after this sensor's matching observation range has
          '''
          replace_once(old_secondary_history, new_secondary_history, "secondary history progress")

          refresh_marker = '''  // refreshChartData — fetches only the slice of time since the chart's current right edge.
          // If new points arrive they are merged into the cache and the chart animates to the new range.
          // If nothing is new the chart is left untouched.
          async function refreshChartData() {
            if (!state.isChartMode) return;
          '''

          refresh_replacement = '''  function getLatestObservationTimestampMs(points) {
            let latestMs = null;
            (Array.isArray(points) ? points : []).forEach((point) => {
              const timeMs = point?.date?.getTime?.();
              if (Number.isFinite(timeMs) && (latestMs === null || timeMs > latestMs)) latestMs = timeMs;
            });
            return latestMs;
          }

          async function refreshStationHistoryChartData() {
            if (!state.isChartMode || state.loadInFlight || state.refreshInFlight) return;
            const dom = domByMap[state.mapKey];
            const cf = dom?.chartFrame;
            if (!isCurrentChartFrame(cf) || !cf?.currentSeriesData?.entries?.length) return;

            const entries = resolveChartableSelectedEntries("station-history-refresh");
            if (!entries?.length) return;
            const currentRange = getDisplayedChartRange(cf);
            if (!currentRange) return;

            const windowValue = normalizeChartRangeValue(state.chartModeTimeRange);
            const liveRange = resolveRange(windowValue);
            const requestRange = {
              startDate: currentRange.startDate,
              endDate: liveRange.endDate,
              startMs: currentRange.startMs,
              endMs: liveRange.endMs,
              startIso: currentRange.startIso,
              endIso: liveRange.endIso,
            };
            const primary = entries.find((entry) => entry.stationId === state.selectedAqiSensorId) || entries[0];
            if (!primary) return;
            state.selectedAqiSensorId = primary.stationId;
            const units = entries[0]?.units || cf.currentSeriesData.units || getCurrentContext()?.units || "";
            const loader = window.UkAqStationHistoryLoader;
            const token = state.loadToken;
            const currentObservationStationIds = new Set(entries.map((entry) => entry.stationId));
            let successfulHeadCount = 0;

            state.refreshInFlight = true;
            try {
              await runChunkQueueWithConcurrency(
                entries,
                Math.min(PRIMARY_OBSERVATION_CONCURRENCY, entries.length),
                async (entry) => {
                  if (token !== state.loadToken || !state.isChartMode) return;
                  const record = getStationHistoryRecord(entry);
                  if (!record) return;
                  const isPrimary = entry.stationId === primary.stationId;
                  try {
                    const payload = await fetchStationSeriesBundle(
                      entry,
                      requestRange,
                      windowValue,
                      { observations: true, aqi: isPrimary },
                      undefined,
                      isPrimary ? STATION_HISTORY_FETCH_PRIORITY.primary : STATION_HISTORY_FETCH_PRIORITY.observations,
                    );
                    if (token !== state.loadToken || !state.isChartMode) return;

                    const identity = loader.resolveAuthoritativeIdentity(payload, {
                      timeseriesId: entry.timeseriesId,
                      pollutant: entry.pollutant || getCurrentContext()?.pollutant,
                    });
                    if (!identity) throw new Error("station_series_authoritative_identity_invalid");
                    record.identity = identity;

                    const observationHeadBounds = stationSeriesHeadBounds(payload, "observations", requestRange);
                    record.observation_points = loader.replaceAuthoritativeObservationHead(
                      record.observation_points,
                      parseStationSeriesObservationPoints(payload.observations),
                      observationHeadBounds?.startUtc,
                      observationHeadBounds?.endUtc,
                    );
                    record.observations_complete = stationHistoryIsComplete(payload.observations)
                      && !stationHistoryNextBoundary(payload.observations, "observations");
                    record.guideline = payload?.observations?.guideline || record.guideline || null;
                    record.observation_head_start_utc = observationHeadBounds?.startUtc || record.observation_head_start_utc || null;
                    record.observation_head_end_utc = observationHeadBounds?.endUtc || record.observation_head_end_utc || null;
                    record.current_observation_next_chunk_end_utc = stationHistoryNextBoundary(payload.observations, "observations")
                      || record.current_observation_next_chunk_end_utc
                      || null;
                    record.current_failed = false;
                    loader.recordCoverageInterval(
                      record,
                      "observations",
                      { start_utc: observationHeadBounds?.startUtc, end_utc: observationHeadBounds?.endUtc },
                      stationHistoryIsComplete(payload.observations) ? "complete" : "partial",
                      { partial_reasons: payload?.observations?.partial_reasons },
                    );

                    if (isPrimary && payload?.aqi) {
                      const aqiHeadBounds = stationSeriesHeadBounds(payload, "aqi", requestRange);
                      const mergedAqi = loader.replaceAuthoritativeAqiHead(
                        record.aqi_points,
                        parseStationSeriesAqiPoints(payload.aqi),
                        aqiHeadBounds?.startUtc,
                        aqiHeadBounds?.endUtc,
                      );
                      record.aqi_points = mergedAqi.points;
                      const aqiSettlement = loader.inspectAqiSettlement(payload.aqi);
                      record.aqi_complete = aqiSettlement.complete && !stationHistoryNextBoundary(payload.aqi, "aqi");
                      record.calculated_combined = loader.isCalculatedCombinedResponse(payload) || record.calculated_combined;
                      record.stable_head_start_utc = aqiHeadBounds?.startUtc || record.stable_head_start_utc || null;
                      record.stable_head_end_utc = aqiHeadBounds?.endUtc || record.stable_head_end_utc || null;
                      loader.recordCoverageInterval(
                        record,
                        "aqi",
                        { start_utc: aqiHeadBounds?.startUtc, end_utc: aqiHeadBounds?.endUtc },
                        aqiSettlement.complete && !mergedAqi.conflicts.length ? "complete" : "partial",
                        {
                          ...aqiSettlement,
                          settled: aqiSettlement.settled && !mergedAqi.conflicts.length,
                        },
                      );
                    }
                    record.updated_at = new Date().toISOString();
                    successfulHeadCount += 1;
                  } catch (error) {
                    recordWebsiteDebugEvent("station_history_refresh_head_failed", {
                      route: "station-series",
                      timeseries_id: entry.timeseriesId,
                      station_id: entry.stationId,
                      error: serializeDebugError(error),
                    });
                  }
                },
              );

              if (token !== state.loadToken || !state.isChartMode || !successfulHeadCount) return;

              let newestObservationMs = null;
              entries.forEach((entry) => {
                const latestMs = getLatestObservationTimestampMs(getStationHistoryRecord(entry)?.observation_points || []);
                if (Number.isFinite(latestMs) && (newestObservationMs === null || latestMs > newestObservationMs)) {
                  newestObservationMs = latestMs;
                }
              });

              const overflowMs = Number.isFinite(newestObservationMs)
                ? Math.max(0, newestObservationMs - currentRange.endMs)
                : 0;
              const targetRange = overflowMs > 0
                ? normalizeDisplayedChartRange({
                  startMs: currentRange.startMs + overflowMs,
                  endMs: currentRange.endMs + overflowMs,
                })
                : currentRange;
              if (!targetRange) return;

              if (overflowMs > 0) {
                stageCachedStationHistoryForDomainAnimation(dom, entries, targetRange, units, primary);
                const stagedSeries = dom.chartFrame?.currentSeriesData;
                const nextYDomain = computeYDomainNiced(
                  stagedSeries?.pointsMap || new Map(),
                  entries,
                  dom.chartFrame?.currentGuideline,
                );
                animateChartDomains(cf, targetRange, nextYDomain, token, () => {
                  if (token !== state.loadToken || !state.isChartMode) return;
                  renderStationHistoryChart(dom, entries, targetRange, units, primary, false, false, {
                    currentObservationStationIds,
                  });
                });
              } else {
                renderStationHistoryChart(dom, entries, currentRange, units, primary, false, false, {
                  currentObservationStationIds,
                });
              }
            } finally {
              state.refreshInFlight = false;
            }
          }

          // refreshChartData — refreshes the open chart without unnecessarily moving its time window.
          // Station-history charts refresh their current heads and only slide left when a new reading
          // extends beyond the visible right edge. The legacy loader keeps its existing delta path.
          async function refreshChartData() {
            if (!state.isChartMode) return;
            if (HEX_MAP_STATION_HISTORY_LOADER_ENABLED) {
              await refreshStationHistoryChartData();
              return;
            }
          '''
          replace_once(refresh_marker, refresh_replacement, "station-history live refresh")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Check patched inline chart script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("hex_map/index.html").read_text(encoding="utf-8")
          marker = "async function refreshStationHistoryChartData()"
          pos = text.index(marker)
          script_start = text.rfind("<script", 0, pos)
          if script_start < 0:
              raise SystemExit("Could not find chart script start")
          body_start = text.find(">", script_start) + 1
          script_end = text.find("</script>", pos)
          if body_start <= 0 or script_end < 0:
              raise SystemExit("Could not isolate chart script")
          Path("/tmp/hex-map-chart-inline.js").write_text(text[body_start:script_end], encoding="utf-8")
          PY
          node --check /tmp/hex-map-chart-inline.js

      - name: Commit patched chart and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply_chart_live_refresh_fix.yml
          git add hex_map/index.html
          git diff --cached --check
          git commit -m "Fix chart progress and live refresh"
          git push origin HEAD:main
