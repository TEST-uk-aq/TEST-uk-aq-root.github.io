<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="uk-aq-site-maintenance" content="on">
  <title>UK AQ — Maintenance</title>
  <link rel="icon" href="/images/favicon.ico" type="image/png">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef4f1;
      color: #17342d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #eef4f1;
    }

    main {
      width: min(42.5rem, 100%);
      text-align: center;
    }

    .maintenance-artwork {
      display: block;
      width: min(100%, 37.5rem);
      height: auto;
      margin: 0 auto;
    }

    p {
      margin: 1.5rem auto 0;
      max-width: 32rem;
      color: #17342d;
      font-size: 1.1rem;
      line-height: 1.55;
    }
  </style>
</head>
<body data-uk-aq-site-maintenance="on">
  <main>
    <img
      class="maintenance-artwork"
      src="/images/UK-AQ-Maintenance-NoDate.png"
      width="600"
      height="500"
      alt="System maintenance in progress. Please try again later."
    >
    <p>System maintenance in progress. Please try again later.</p>
  </main>
</body>
</html>
