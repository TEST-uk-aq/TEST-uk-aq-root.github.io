<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="uk-aq-site-maintenance" content="on">
  <title>UK AQ — Maintenance</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef4f1;
      color: #17342d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top, rgba(53, 119, 96, 0.16), transparent 42%),
        #eef4f1;
    }

    main {
      width: min(42.5rem, 100%);
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border: 1px solid rgba(23, 52, 45, 0.14);
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.25rem 3rem rgba(23, 52, 45, 0.12);
      text-align: center;
    }

    .brand {
      margin: 0 0 1.5rem;
      color: #23724f;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .maintenance-artwork {
      display: block;
      width: min(100%, 37.5rem);
      height: auto;
      margin: 0 auto;
    }

    p {
      margin: 1.25rem auto 0;
      max-width: 27rem;
      color: #456159;
      font-size: 1.05rem;
      line-height: 1.65;
    }
  </style>
</head>
<body data-uk-aq-site-maintenance="on">
  <main>
    <p class="brand">UK AQ</p>
    <img
      class="maintenance-artwork"
      src="/images/UK-AQ-Maintenance-NoDate.png"
      width="600"
      height="500"
      alt="System maintenance in progress. Please try again later."
    >
    <p>UK AQ is temporarily unavailable while maintenance is carried out. Please try again later.</p>
  </main>
</body>
</html>
