name: Deploy GH Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Public website maintenance operation
        required: true
        default: status
        type: choice
        options:
          - status
          - "on"
          - "off"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare & Build
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      operation: ${{ steps.mode.outputs.operation }}
      should_deploy: ${{ steps.mode.outputs.should_deploy }}
      site_url: ${{ steps.mode.outputs.site_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve requested and currently published mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          site_host="$(tr -d '[:space:]' < CNAME)"
          test -n "${site_host}" || { echo "CNAME is empty."; exit 1; }
          site_url="https://${site_host}"
          requested="${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preserve' }}"

          case "${requested}" in
            on|off)
              mode="${requested}"
              should_deploy=true
              ;;
            status)
              mode="$(node scripts/uk_aq_site_maintenance.mjs resolve --base-url "${site_url}")"
              should_deploy=false
              ;;
            preserve)
              mode="$(node scripts/uk_aq_site_maintenance.mjs resolve --base-url "${site_url}")"
              should_deploy=true
              ;;
            *)
              echo "Unsupported site operation: ${requested}"
              exit 1
              ;;
          esac

          printf 'mode=%s\n' "${mode}" >> "${GITHUB_OUTPUT}"
          printf 'operation=%s\n' "${requested}" >> "${GITHUB_OUTPUT}"
          printf 'should_deploy=%s\n' "${should_deploy}" >> "${GITHUB_OUTPUT}"
          printf 'site_url=%s\n' "${site_url}" >> "${GITHUB_OUTPUT}"

      - name: Report current public mode
        if: steps.mode.outputs.operation == 'status'
        run: |
          node scripts/uk_aq_site_maintenance.mjs verify \
            --base-url "${{ steps.mode.outputs.site_url }}" \
            --expected auto \
            --attempts 3 \
            --delay-seconds 5

      - name: Configure GitHub Pages
        if: steps.mode.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Verify AQI history base secret
        if: steps.mode.outputs.should_deploy == 'true' && steps.mode.outputs.mode == 'off'
        run: test -n "${UK_AQ_AQI_HISTORY_BASE_URL}"
        env:
          UK_AQ_AQI_HISTORY_BASE_URL: ${{ secrets.UK_AQ_AQI_HISTORY_BASE_URL }}

      - name: Inject Supabase config
        if: steps.mode.outputs.should_deploy == 'true' && steps.mode.outputs.mode == 'off'
        run: node scripts/uk_aq_inject_project_ref.mjs
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SB_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}
          UK_AQ_TURNSTILE_SITE_KEY: ${{ secrets.UK_AQ_TURNSTILE_SITE_KEY }}
          UK_AQ_AQI_HISTORY_BASE_URL: ${{ secrets.UK_AQ_AQI_HISTORY_BASE_URL }}
          UK_AQ_WEBSITE_DEBUG_LOG_ENABLED: ${{ vars.UK_AQ_WEBSITE_DEBUG_LOG_ENABLED || 'false' }}
          UK_AQ_AQI_MUTABLE_HOURS: ${{ vars.UK_AQ_AQI_MUTABLE_HOURS || '120' }}

      - name: Build content-hashed Pages artifact
        if: steps.mode.outputs.should_deploy == 'true' && steps.mode.outputs.mode == 'off'
        run: |
          test ! -e .pages-site
          mkdir .pages-site
          rsync -a --exclude='.git/' --exclude='.pages-site/' --exclude='maintenance/' ./ .pages-site/
          node scripts/uk_aq_inject_initial_loader.mjs .pages-site
          node scripts/uk_aq_content_hash_assets.mjs .pages-site

      - name: Build maintenance-only Pages artifact
        if: steps.mode.outputs.should_deploy == 'true' && steps.mode.outputs.mode == 'on'
        run: |
          node scripts/uk_aq_site_maintenance.mjs build \
            --mode on \
            --source-root . \
            --output-root .pages-site \
            --deployment-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-built-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

      - name: Add normal-site mode evidence
        if: steps.mode.outputs.should_deploy == 'true' && steps.mode.outputs.mode == 'off'
        run: |
          node scripts/uk_aq_site_maintenance.mjs build \
            --mode off \
            --source-root . \
            --output-root .pages-site \
            --deployment-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-built-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

      - name: Upload artifact
        if: steps.mode.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - id: deployment
        name: Deploy GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Positively verify the deployed public mode
        run: |
          node scripts/uk_aq_site_maintenance.mjs verify \
            --base-url "${{ needs.prepare.outputs.site_url }}" \
            --expected "${{ needs.prepare.outputs.mode }}" \
            --deployment-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --attempts 12 \
            --delay-seconds 5
