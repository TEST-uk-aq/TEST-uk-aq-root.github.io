name: One-off Hex Map chart fix cleanup

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/oneoff-hex-map-chart-resize-trigger.txt

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary fix tooling
        shell: bash
        run: |
          git pull --ff-only origin main
          git rm .github/workflows/oneoff-hex-map-chart-resize-fix.yml
          git rm .github/scripts/oneoff_patch_hex_map_chart_resize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Hex Map fix tooling"
          git push origin HEAD:main

      - name: Close trigger pull request and delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: gh pr close "$PR_NUMBER" --delete-branch --repo "$GH_REPO"
