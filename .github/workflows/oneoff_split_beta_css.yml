name: One-off split beta CSS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff_split_beta_css.yml

permissions:
  contents: write

jobs:
  split-beta-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Separate permanent UI CSS from beta notice CSS
        shell: bash
        run: |
          echo '' | base64 -d | python

      - name: Structural validation and commit
        shell: bash
        run: |
          test -f site-ui.css
          grep -Fq 'These rules must remain when the beta notice is retired.' site-ui.css
          grep -Fq 'grid-template-columns: minmax(0, 1fr) 1.17rem 6.4rem;' site-ui.css
          grep -Fq 'content: "Last observed: ";' site-ui.css
          grep -Fq '<link rel="stylesheet" href="/site-ui.css">' index.html
          grep -Fq '<link rel="stylesheet" href="/site-ui.css">' hex_map/index.html
          if grep -Eq '^\.(home-page|hex-map-page)' beta-notice.css; then
            echo 'beta-notice.css still contains permanent page selectors' >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff_split_beta_css.yml
          git add beta-notice.css site-ui.css index.html hex_map/index.html
          git diff --cached --check
          git commit -m "Separate permanent UI CSS from beta notice"
          git push
