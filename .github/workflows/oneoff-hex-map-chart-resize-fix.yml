name: One-off Hex Map chart resize fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-hex-map-chart-resize-fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/oneoff-hex-map-chart-resize-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the final Hex Map chart fix
        shell: bash
        run: |
          git pull --ff-only origin main
          python .github/scripts/oneoff_patch_hex_map_chart_resize.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html = Path("hex_map/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
          checked = 0
          for index, (attrs, body) in enumerate(scripts):
              attrs_lower = attrs.lower()
              if "src=" in attrs_lower or "application/json" in attrs_lower:
                  continue
              target = Path(f"/tmp/hex-map-inline-{index}.js")
              target.write_text(body, encoding="utf-8")
              subprocess.run(["node", "--check", str(target)], check=True)
              checked += 1
          if checked == 0:
              raise SystemExit("no inline JavaScript blocks were validated")
          print(f"Validated {checked} inline JavaScript blocks")
          PY

      - name: Commit the Hex Map fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hex_map/index.html
          git diff --cached --check
          git commit -m "Preserve Hex Map chart lines during resize"
          git push origin HEAD:main
